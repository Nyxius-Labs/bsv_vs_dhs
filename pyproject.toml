[project]
name = "gate0"
version = "0.1.0"
description = "Gate 0 pilot: validating LLM agents as market participants (BSV vs DHS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tabulate>=0.10.0",
]

[project.scripts]
gate0 = "gate0.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
